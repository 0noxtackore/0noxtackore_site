name: IndexNow Ping

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-ping
  cancel-in-progress: false

jobs:
  ping:
    if: github.repository == '0noxtackore/0noxtackore_site'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Submit URLs to IndexNow
        run: npm run indexnow
